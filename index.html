<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숨은그림 찾기</title>
<style>
:root{--ink:#12343b;--teal:#0f6b73;--mint:#e6f2ef;--paper:#fbfdfc;--line:#b9d3ce;--alert:#d9480f;--ok:#2b8a3e}
*{box-sizing:border-box}
body{margin:0;background:var(--mint);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.screen{display:none;max-width:980px;margin:0 auto;padding:20px 14px 40px}
.screen.on{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:28px 24px;max-width:460px;margin:8vh auto 0}
h1{font-size:26px;margin:0 0 6px}
.sub{margin:0 0 22px;color:#3d5f66}
label{display:block;font-weight:600;margin:14px 0 4px}
input{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:6px;background:#fff}
input:focus,button:focus-visible{outline:3px solid #7cc4c9;outline-offset:1px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:6px;padding:13px 20px;background:var(--teal);color:#fff;width:100%;margin-top:22px}
.err{color:var(--alert);min-height:1.4em;margin:8px 0 0;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-size:30px;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.5px}
.count{font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:5px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:14px}
.chip.done{background:var(--ok);color:#fff;border-color:var(--ok);text-decoration:line-through}
.stage{position:relative;line-height:0;border:2px solid var(--ink);border-radius:6px;overflow:hidden;cursor:crosshair;touch-action:manipulation;background:#fff}
.stage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.mark{position:absolute;border:4px solid var(--ok);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:rgba(43,138,62,.15)}
.miss{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;color:var(--alert);font:800 26px/26px sans-serif;text-align:center;animation:fade .6s forwards}
@keyframes fade{to{opacity:0;transform:scale(1.6)}}
.big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0}
.center{text-align:center}
</style>
</head>
<body>
<section class="screen on" id="s1">
  <div class="card">
    <h1>숨은그림 찾기</h1>
    <p class="sub">그림 속의 알코올젤 5개를 가장 빨리 찾아보세요.</p>
    <label for="dept">소속 부서(오타주의!)</label>
    <input id="dept" maxlength="30" autocomplete="organization" placeholder="예: 직원관리 Unit">
    <label for="name">이름(오타주의!)</label>
    <input id="name" maxlength="20" autocomplete="name" placeholder="예: 홍길동">
    <p class="err" id="err1" aria-live="polite"></p>
    <button id="next">다음</button>
  </div>
</section>

<section class="screen" id="s2">
  <div class="card center">
    <h1>준비되셨나요?</h1>
    <p class="sub">시작 버튼을 누르면 시간이 흐릅니다.<br>그림에서 손소독제 5개를 찾아 클릭(터치)하세요.</p>
    <div class="chips" id="previewChips" style="justify-content:center"></div>
    <button id="start">게임 시작</button>
  </div>
</section>

<section class="screen" id="s3">
  <div class="bar">
    <span class="timer" id="timer">00:00.0</span>
    <span class="count">찾은 개수 <b id="found">0</b> / 5</span>
  </div>
  <div class="chips" id="chips"></div>
  <div class="stage" id="stage"><img id="pic" src="hidden.png" alt="숨은그림찾기 이미지" draggable="false"></div>
</section>

<section class="screen" id="s4">
  <div class="card center">
    <h1>완료!</h1>
    <p class="sub" id="who"></p>
    <div class="big" id="final"></div>
    <p class="sub" id="status" aria-live="polite">기록을 제출하는 중입니다…</p>
  </div>
</section>

<script>
/* 운영 설정: 정답 좌표와 Apps Script 웹앱 전체 URL을 입력하세요. */
const CONFIG = {
  IMAGE: "hidden.png",
  ENDPOINT: "https://script.google.com/macros/s/AKfycbzNsabSzWgwRJWWYOj1fi5Kx1Jn4jhGs8Jy2SMkoNPEXeyGlE3G5cje7V0BcIsUiYf1PQ/exec",
  PENALTY_MS: 1000,
  // x, y: 이미지 가로·세로 대비 중심 위치(%), r: 정답 판정 반경(이미지 가로 대비 %)
  TARGETS: [
    { name: "체어옆소독제", x: 7,  y: 38, r: 4 },
    { name: "벽걸이소독제", x: 68, y: 52, r: 4 },
    { name: "어디어디소독제", x: 87, y: 41, r: 4 },
    { name: "저기있는소독제", x: 90, y: 25, r: 4 },
    { name: "찾기어려운소독제", x: 30, y: 91, r: 4 }
  ]
};

const $ = id => document.getElementById(id);
const screens = document.querySelectorAll(".screen");
const pic = $("pic");
let player = {};
let startTime = 0;
let animationFrame = 0;
let foundSet = new Set();
let misses = 0;
let running = false;

function show(id) {
  screens.forEach(screen => screen.classList.toggle("on", screen.id === id));
  window.scrollTo(0, 0);
}
function formatTime(ms) {
  const t = Math.floor(ms / 100);
  return `${String(Math.floor(t / 600)).padStart(2, "0")}:${String(Math.floor(t % 600 / 10)).padStart(2, "0")}.${t % 10}`;
}
function renderChips(element) {
  element.innerHTML = CONFIG.TARGETS.map((target, i) =>
    `<span class="chip ${foundSet.has(i) ? "done" : ""}">${target.name}</span>`
  ).join("");
}
function updateTimer() {
  if (!running) return;
  $("timer").textContent = formatTime(performance.now() - startTime);
  animationFrame = requestAnimationFrame(updateTimer);
}

pic.src = CONFIG.IMAGE;
pic.addEventListener("error", () => {
  $("status").textContent = "이미지를 불러올 수 없습니다. hidden.png 파일이 HTML과 같은 폴더에 있는지 확인해주세요.";
}, { once: true });

renderChips($("previewChips"));

$("next").addEventListener("click", () => {
  const dept = $("dept").value.trim();
  const name = $("name").value.trim();
  if (!dept || !name) {
    $("err1").textContent = "소속 부서와 이름을 모두 입력해주세요.";
    return;
  }
  player = { dept, name };
  $("err1").textContent = "";
  show("s2");
});

$("start").addEventListener("click", () => {
  foundSet.clear();
  misses = 0;
  $("found").textContent = "0";
  $("timer").textContent = "00:00.0";
  $("stage").querySelectorAll(".mark,.miss").forEach(el => el.remove());
  renderChips($("chips"));
  show("s3");
  startTime = performance.now();
  running = true;
  updateTimer();
});

$("stage").addEventListener("pointerdown", event => {
  if (!running || !pic.naturalWidth) return;

  const rect = pic.getBoundingClientRect();
  const px = event.clientX - rect.left;
  const py = event.clientY - rect.top;
  const xPercent = px / rect.width * 100;
  const yPercent = py / rect.height * 100;

  let hit = -1;
  CONFIG.TARGETS.forEach((target, i) => {
    if (foundSet.has(i)) return;
    const dx = px - target.x / 100 * rect.width;
    const dy = py - target.y / 100 * rect.height;
    if (Math.hypot(dx, dy) <= target.r / 100 * rect.width) hit = i;
  });

  if (hit >= 0) {
    const target = CONFIG.TARGETS[hit];
    foundSet.add(hit);
    const mark = document.createElement("div");
    mark.className = "mark";
    mark.style.cssText = `left:${target.x}%;top:${target.y}%;width:${target.r * 2}%;aspect-ratio:1`;
    $("stage").appendChild(mark);
    $("found").textContent = foundSet.size;
    renderChips($("chips"));
    if (foundSet.size === CONFIG.TARGETS.length) finish();
  } else {
    misses++;
    const miss = document.createElement("div");
    miss.className = "miss";
    miss.textContent = "✕";
    miss.style.left = `${xPercent}%`;
    miss.style.top = `${yPercent}%`;
    $("stage").appendChild(miss);
    setTimeout(() => miss.remove(), 700);
  }
});

function finish() {
  running = false;
  cancelAnimationFrame(animationFrame);
  const elapsed = Math.round(performance.now() - startTime);
  const total = elapsed + misses * CONFIG.PENALTY_MS;
  $("timer").textContent = formatTime(elapsed);
  $("who").textContent = `${player.dept} · ${player.name}`;
  $("final").textContent = formatTime(total);
  show("s4");
  submit({
    dept: player.dept,
    name: player.name,
    ms: total,
    rawMs: elapsed,
    misses
  });
}

async function submit(record) {
  const status = $("status");
  if (!CONFIG.ENDPOINT || CONFIG.ENDPOINT.startsWith("여기에_")) {
    status.textContent = "기록 제출 주소가 설정되지 않았습니다. 담당자에게 문의해주세요.";
    return;
  }
  try {
    await fetch(CONFIG.ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(record)
    });
    status.textContent = "기록 제출 요청이 완료되었습니다. 참여해주셔서 감사합니다!";
  } catch (error) {
    status.textContent = "제출에 실패했습니다. 네트워크를 확인하고 담당자에게 알려주세요.";
  }
}
</script>
</body>
</html>
