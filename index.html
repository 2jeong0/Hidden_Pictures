<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숨은그림찾기 이벤트</title>
<style>
:root{--ink:#12343b;--teal:#0f6b73;--mint:#e6f2ef;--paper:#fbfdfc;--line:#b9d3ce;--alert:#d9480f;--ok:#2b8a3e}
*{box-sizing:border-box}
body{margin:0;background:var(--mint);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.screen{display:none;max-width:980px;margin:0 auto;padding:20px 14px 40px}
.screen.on{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:28px 24px;max-width:460px;margin:8vh auto 0}
h1{font-size:26px;margin:0 0 6px}
p.sub{margin:0 0 22px;color:#3d5f66}
label{display:block;font-weight:600;margin:14px 0 4px}
input{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:6px;background:#fff}
input:focus,button:focus-visible{outline:3px solid #7cc4c9;outline-offset:1px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:6px;padding:13px 20px;background:var(--teal);color:#fff;width:100%;margin-top:22px}
button:disabled{background:#8aa9ac;cursor:default}
.err{color:var(--alert);min-height:1.4em;margin:8px 0 0;font-size:14px}
/* game */
.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-size:30px;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.5px}
.count{font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:5px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:14px}
.chip.done{background:var(--ok);color:#fff;border-color:var(--ok);text-decoration:line-through}
.stage{position:relative;line-height:0;border:2px solid var(--ink);border-radius:6px;overflow:hidden;cursor:crosshair;touch-action:manipulation;background:#fff}
.stage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.mark{position:absolute;border:4px solid var(--ok);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:rgba(43,138,62,.15)}
.miss{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;color:var(--alert);font:800 26px/26px sans-serif;text-align:center;animation:fade .6s forwards}
@keyframes fade{to{opacity:0;transform:scale(1.6)}}
.big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0}
.center{text-align:center}
#adminBox{display:none;background:#fff;border:1px dashed var(--alert);padding:10px;margin-top:12px;font:13px/1.5 monospace;line-height:1.5;white-space:pre-wrap}
</style>
</head>
<body>

<!-- 1. 정보 입력 -->
<section class="screen on" id="s1">
  <div class="card">
    <h1>숨은그림 찾기</h1>
    <p class="sub">그림 속에 숨은 5개를 가장 빨리 찾아보세요.</p>
    <label for="dept">소속 부서(오타주의!)</label>
    <input id="dept" maxlength="30" autocomplete="off" placeholder="예: 직원관리 Unit">
    <label for="name">이름(오타주의!)</label>
    <input id="name" maxlength="20" autocomplete="off" placeholder="예: 홍길동">
    <p class="err" id="err1"></p>
    <button id="next">다음</button>
  </div>
</section>

<!-- 2. 안내 -->
<section class="screen" id="s2">
  <div class="card center">
    <h1>준비되셨나요?</h1>
    <p class="sub">시작 버튼을 누르면 시간이 흐릅니다.<br>그림에서 아래 5개를 찾아 클릭(터치)하세요.</p>
    <div class="chips" id="previewChips" style="justify-content:center"></div>
    <button id="start">게임 시작</button>
  </div>
</section>

<!-- 3. 게임 -->
<section class="screen" id="s3">
  <div class="bar">
    <span class="timer" id="timer">00:00.0</span>
    <span class="count">찾은 개수 <b id="found">0</b> / 5</span>
  </div>
  <div class="chips" id="chips"></div>
  <div class="stage" id="stage"><img id="pic" alt="숨은그림찾기 이미지" draggable="false"></div>
  <div id="adminBox"></div>
</section>

<!-- 4. 결과 -->
<section class="screen" id="s4">
  <div class="card center">
    <h1>완료!</h1>
    <p class="sub" id="who"></p>
    <div class="big" id="final"></div>
    <p class="sub" id="status">기록을 제출하는 중입니다…</p>
  </div>
</section>

<script>
/* ============ 설정 (여기만 수정하세요) ============ */
const CONFIG = {
  IMAGE: "hidden.jpg",          // 같은 폴더에 둘 이미지 파일명
  ENDPOINT: "AKfycbzNsabSzWgwRJWWYOj1fi5Kx1Jn4jhGs8Jy2SMkoNPEXeyGlE3G5cje7V0BcIsUiYf1PQ/exec",  // Google Apps Script 웹앱 URL
  PENALTY_MS: 1000,                // 오답 클릭 1회당 가산 시간(ms). 예: 3000 = 3초
  // x, y = 이미지 가로/세로 대비 중심 위치(%), r = 정답 인정 반경(이미지 가로 대비 %)
  // 실제 좌표는 주소 끝에 ?admin=1 을 붙여 이미지를 클릭하면 확인할 수 있습니다.
  TARGETS: [
    { name: "청진기1",   x: 20, y: 30, r: 4 },
    { name: "마스크",   x: 70, y: 25, r: 4 },
    { name: "주사기",   x: 45, y: 60, r: 4 },
    { name: "손소독제", x: 82, y: 72, r: 4 },
    { name: "체온계",   x: 15, y: 80, r: 4 }
  ]
};
/* ================================================== */

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ADMIN = params.get("admin") === "1";
let player = {}, t0 = 0, raf = 0, foundSet = new Set(), misses = 0, running = false;

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $(id).classList.add("on"); window.scrollTo(0,0); }
function fmt(ms){ const t=Math.floor(ms/100); const m=Math.floor(t/600), s=Math.floor(t%600/10), d=t%10; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+d; }

// 이미지 로드 (파일이 없으면 테스트용 임시 그림 사용)
const pic = $("pic");
pic.onerror = () => { pic.onerror = null; pic.src = placeholder(); };
pic.src = CONFIG.IMAGE;
function placeholder(){
  const W=1000,H=650;
  let g=`<rect width="${W}" height="${H}" fill="#dfe9e3"/>`;
  for(let i=0;i<70;i++){ g+=`<circle cx="${(i*137)%W}" cy="${(i*89)%H}" r="${20+(i*7)%40}" fill="hsl(${(i*41)%360},25%,${70+(i%3)*6}%)"/>`; }
  CONFIG.TARGETS.forEach((t,i)=>{ g+=`<rect x="${t.x/100*W-14}" y="${t.y/100*H-14}" width="28" height="28" rx="6" fill="hsl(${i*70},45%,45%)"/>`; });
  g+=`<text x="20" y="40" font-size="26" fill="#12343b">테스트용 임시 이미지 (hidden.jpg 를 넣으면 교체됩니다)</text>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${g}</svg>`);
}

function renderChips(el){ el.innerHTML = CONFIG.TARGETS.map((t,i)=>`<span class="chip ${foundSet.has(i)?'done':''}">${t.name}</span>`).join(""); }
renderChips($("previewChips"));

// 1 → 2
$("next").onclick = () => {
  const dept=$("dept").value.trim(), name=$("name").value.trim();
  if(!dept||!name){ $("err1").textContent="소속 부서와 이름을 모두 입력해주세요."; return; }
  player={dept,name}; $("err1").textContent=""; show("s2");
};

// 2 → 3
$("start").onclick = () => {
  foundSet.clear(); misses=0; $("found").textContent="0";
  document.querySelectorAll(".mark,.miss").forEach(e=>e.remove());
  renderChips($("chips")); show("s3");
  t0=performance.now(); running=true;
  const tick=()=>{ if(!running) return; $("timer").textContent=fmt(performance.now()-t0); raf=requestAnimationFrame(tick); };
  tick();
  if(ADMIN){ $("adminBox").style.display="block"; $("adminBox").textContent="[관리자 모드] 이미지를 클릭하면 좌표가 표시됩니다.\n"; }
};

// 클릭 판정
$("stage").addEventListener("pointerdown", e => {
  if(!running) return;
  const rect=pic.getBoundingClientRect();
  const px=(e.clientX-rect.left), py=(e.clientY-rect.top);
  const xp=px/rect.width*100, yp=py/rect.height*100;

  if(ADMIN){
    $("adminBox").textContent += `{ name: "", x: ${xp.toFixed(1)}, y: ${yp.toFixed(1)}, r: 4 },\n`;
    return;
  }
  let hit=-1;
  CONFIG.TARGETS.forEach((t,i)=>{
    if(foundSet.has(i)) return;
    const dx=px-t.x/100*rect.width, dy=py-t.y/100*rect.height;
    if(Math.hypot(dx,dy) <= t.r/100*rect.width) hit=i;
  });
  if(hit>=0){
    const t=CONFIG.TARGETS[hit]; foundSet.add(hit);
    const d=document.createElement("div"); d.className="mark";
    d.style.cssText=`left:${t.x}%;top:${t.y}%;width:${t.r*2}%;aspect-ratio:1`;
    $("stage").appendChild(d);
    $("found").textContent=foundSet.size; renderChips($("chips"));
    if(foundSet.size===CONFIG.TARGETS.length) finish();
  } else {
    misses++;
    const m=document.createElement("div"); m.className="miss"; m.textContent="✕";
    m.style.left=px+"px"; m.style.top=py+"px"; $("stage").appendChild(m);
    setTimeout(()=>m.remove(),700);
  }
});

// 완료
function finish(){
  running=false; cancelAnimationFrame(raf);
  const elapsed = Math.round(performance.now()-t0);
  const total = elapsed + misses*CONFIG.PENALTY_MS;
  $("timer").textContent=fmt(elapsed);
  $("who").textContent=`${player.dept} · ${player.name}`;
  $("final").textContent=fmt(total);
  show("s4"); submit({dept:player.dept,name:player.name,ms:total,rawMs:elapsed,misses});
}

async function submit(rec){
  const st=$("status");
  if(!CONFIG.ENDPOINT){
    const k="hidden_game_test"; const arr=JSON.parse(localStorage.getItem(k)||"[]"); arr.push(rec); localStorage.setItem(k,JSON.stringify(arr));
    st.textContent="테스트 모드: 서버 주소(ENDPOINT)가 비어 있어 이 브라우저에만 저장했습니다."; return;
  }
  try{
    // text/plain 으로 보내면 CORS 사전요청 없이 Apps Script 로 전달됩니다.
    await fetch(CONFIG.ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)});
    st.textContent="기록이 제출되었습니다. 참여해주셔서 감사합니다!";
  }catch(err){
    st.textContent="제출에 실패했습니다. 네트워크를 확인하고 담당자에게 알려주세요.";
  }
}
</script>
</body>
</html>
